# שומר את הגשר ב־Render ער (השרת החינמי נרדם אחרי 15 דקות בלי בקשות, ופורום ההדגמה נמחק כשהוא נרדם).
name: keep-bridge-awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: ping /health
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 70 https://progbot-bridge.onrender.com/health || true)
            echo "try $i → $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "the bridge did not answer"; exit 0
